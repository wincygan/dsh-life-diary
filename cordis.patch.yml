# dsh-life-diary bundle patch
#
# 两本日记：
#   me/     自己那本：会话结束时自动追加碎片，可以糙、可以不完整
#   owner/  给你的那本：换日时只读自己那本汇总，不重读整天上下文
#
# 这里**不带任何预设值**：没有仓库、没有令牌、没有路径、没有时区、没有日记本名称。
# 装完什么都不填也能跑——日记落在使用者自己机器的 dsh 数据目录下，时区用它本机的。
# 想改设置，去「设置 → 日记」里改，那些会存进本机的 settings.json，覆盖这里的空默认。

- insert:
    - id: dsh-life-diary
      name: 'dsh-life-diary'
